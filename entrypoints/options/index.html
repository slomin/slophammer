<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SlopHammer — Options</title>
    <style>
      :root {
        --bg: #fafaf7;
        --bg-2: #f1f0ea;
        --fg: #17171a;
        --fg-2: #4a4a50;
        --muted: #6d6a61;
        --panel: #ffffff;
        --line: #d8d5cc;
        --line-2: #eceae2;
        --accent: #d94e1f;
        --accent-ink: #b8341a;
        --ok: #2f7a3a;
        --danger: #b8341a;
        --radius: 6px;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

        --b-human:  #2f7a3a;
        --b-light:  #b88a1a;
        --b-heavy:  #c2521a;
        --b-ai:     #b8341a;
      }
      html[data-theme="dark"] {
        --bg: #0f0f11;
        --bg-2: #17171b;
        --fg: #ecebe4;
        --fg-2: #b2b0a6;
        --muted: #8a8a90;
        --panel: #17171b;
        --line: #2a2a2f;
        --line-2: #222226;
        --accent: #ff7043;
        --accent-ink: #ff7043;
        --ok: #6ed07a;
        --danger: #ff6a48;

        --b-human:  #6ed07a;
        --b-light:  #e8c15a;
        --b-heavy:  #ff9a63;
        --b-ai:     #ff6a48;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      html { background: var(--bg); }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
        padding: 32px 28px 120px;
        max-width: 720px;
      }

      /* page header */
      .page-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 22px;
      }
      .brand {
        display: inline-flex; align-items: center; gap: 10px;
        font-size: 12px; letter-spacing: 0.08em;
        color: var(--accent); font-weight: 600;
      }
      .brand .mark {
        display: inline-block; width: 14px; height: 14px;
        background: var(--accent); position: relative;
        transform: rotate(-12deg);
      }
      .brand .mark::after {
        content: ""; position: absolute; left: 50%; top: 100%;
        transform: translateX(-50%);
        width: 2px; height: 7px; background: var(--fg);
      }
      .brand .sep { color: var(--muted); font-weight: 400; letter-spacing: 0.08em; }
      .brand .where { color: var(--fg); }
      .page-head .ver {
        font-size: 10.5px; color: var(--muted); letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }

      /* install area (renderer-owned container) */
      .install-slot { margin-bottom: 32px; }

      /* installed card */
      .install-card {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .install-card::before {
        content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
        width: 2px; background: var(--ok); border-radius: 2px;
      }
      .install-card .status {
        display: inline-flex; align-items: center; justify-content: center;
        width: 22px; height: 22px; border-radius: 50%;
        color: var(--ok); font-weight: 700; font-size: 14px;
        margin-left: 4px;
      }
      .install-card .info { min-width: 0; }
      .install-card .info .title {
        font-size: 14px; font-weight: 700;
        letter-spacing: -0.005em; margin-bottom: 6px;
      }
      .install-card .info .meta {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        font-size: 11.5px; color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .model-chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 8px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--fg-2);
        font-size: 11px;
        max-width: 100%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .model-chip::before {
        content: ""; display: inline-block;
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--ok); flex: 0 0 auto;
      }
      .install-card .meta .dot-sep { color: var(--muted); opacity: .6; }
      .install-card .update-row {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        margin-top: 10px; padding-top: 10px;
        border-top: 1px dashed var(--line-2);
      }
      .install-card .update-note {
        font-size: 11px; color: var(--muted);
        letter-spacing: 0.02em;
      }
      .install-card .update-note.error { color: var(--danger); }
      .install-card .update-chip {
        display: inline-flex; align-items: center;
        padding: 3px 8px;
        background: color-mix(in oklch, var(--accent) 12%, var(--panel));
        border: 1px solid color-mix(in oklch, var(--accent) 40%, var(--line));
        border-radius: 3px;
        font-size: 11px;
        color: var(--accent-ink);
        font-variant-numeric: tabular-nums;
      }

      /* buttons */
      .btn {
        all: unset; display: inline-flex; align-items: center; gap: 6px;
        cursor: pointer;
        padding: 8px 14px;
        font-family: inherit;
        font-size: 11px; font-weight: 600;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--fg-2);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 4px;
        white-space: nowrap;
      }
      .btn:hover { color: var(--fg); border-color: var(--muted); background: var(--bg-2); }
      .btn.danger { color: var(--danger); border-color: var(--danger); }
      .btn.danger:hover {
        background: color-mix(in oklch, var(--danger) 10%, transparent);
        color: var(--danger);
      }
      .btn.primary {
        color: #fff; background: var(--accent); border-color: var(--accent);
      }
      .btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
      .btn.subtle { border-color: transparent; color: var(--muted); padding: 8px 10px; }
      .btn.subtle:hover { color: var(--fg); background: var(--bg-2); border-color: var(--line); }
      .btn.compact { padding: 4px 10px; font-size: 10px; }
      .btn:disabled { opacity: .5; cursor: default; }

      /* drop zone */
      .drop-zone {
        border: 1.5px dashed var(--line);
        border-radius: var(--radius);
        padding: 28px 24px;
        text-align: center;
        cursor: pointer;
        background: var(--panel);
        transition: border-color 100ms ease, background 100ms ease;
      }
      .drop-zone:hover,
      .drop-zone.dragover { border-color: var(--accent); background: var(--bg-2); }
      .drop-zone .dz-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
      .drop-zone .dz-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }
      .drop-zone code {
        background: var(--bg-2); border: 1px solid var(--line);
        padding: 1px 5px; border-radius: 3px;
      }
      .drop-zone .dz-actions {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; flex-wrap: wrap;
      }

      /* installing */
      .installing-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 18px;
        background: var(--panel);
      }
      .installing-card .row1 {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 10px;
      }
      .installing-card .title { font-size: 13.5px; font-weight: 700; }
      .installing-card .pct { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
      .installing-card .progress {
        height: 4px; background: var(--bg-2);
        border-radius: 2px; overflow: hidden; margin-bottom: 10px;
        border: 1px solid var(--line);
      }
      .installing-card .progress > div {
        height: 100%; background: var(--accent);
        transition: width 180ms ease;
      }
      .installing-card .cur-file {
        font-size: 11px; color: var(--muted); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .installing-card .count {
        font-size: 10.5px; color: var(--muted);
        font-variant-numeric: tabular-nums; margin-top: 6px;
      }

      /* error */
      .error-card {
        border: 1px solid var(--danger);
        border-radius: var(--radius);
        padding: 14px 16px;
        background: color-mix(in oklch, var(--danger) 8%, var(--panel));
      }
      .error-card .eh {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 12px; margin-bottom: 4px;
      }
      .error-card .et {
        color: var(--danger); font-weight: 700;
        letter-spacing: 0.04em; font-size: 12px; text-transform: uppercase;
      }
      .error-card .em { font-size: 12px; color: var(--fg-2); }
      .error-card .btn.danger { padding: 4px 10px; font-size: 10px; }
      .error-card .err-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .error-card .err-actions .btn { padding: 4px 10px; font-size: 10px; }

      /* settings */
      .settings-section-title {
        display: flex; align-items: baseline; gap: 10px;
        font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--muted); font-weight: 600;
        margin: 0 0 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line-2);
      }
      .settings-section-title .count {
        font-family: inherit; font-weight: 400;
        color: var(--muted); opacity: .7;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
      }

      .settings-group {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 6px 16px 12px;
        margin: 0 0 14px;
        background: var(--panel);
      }
      .settings-group legend {
        padding: 0 8px;
        margin-left: -4px;
        font-size: 11.5px; font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--fg);
      }
      .settings-guidance {
        margin: 8px 6px 4px;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.5;
      }

      .settings-row {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 6px;
        margin: 0 -6px;
        cursor: pointer;
        font-size: 13px;
        border-radius: 4px;
        transition: background 80ms ease;
      }
      .settings-row:hover { background: var(--bg-2); }
      .settings-row + .settings-row { border-top: 1px dashed var(--line-2); }
      .settings-row input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 16px; height: 16px; margin: 3px 0 0;
        border: 1.5px solid var(--line);
        border-radius: 50%;
        background: var(--panel);
        cursor: pointer;
        position: relative;
        flex: 0 0 auto;
        transition: border-color 80ms ease;
      }
      .settings-row input[type="radio"]:hover { border-color: var(--muted); }
      .settings-row input[type="radio"]:checked { border-color: var(--accent); }
      .settings-row input[type="radio"]:checked::after {
        content: ""; position: absolute;
        inset: 3px; border-radius: 50%;
        background: var(--accent);
      }
      .settings-row input[type="radio"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .settings-row-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
      .settings-row-label {
        color: var(--fg);
        font-weight: 600;
        letter-spacing: -0.005em;
      }
      .settings-row-desc {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.5;
      }
      .settings-row:has(input:checked) .settings-row-desc { color: var(--fg-2); }

      .swatch-row {
        display: inline-flex; align-items: center; gap: 4px;
        margin-left: 6px; vertical-align: 1px;
      }
      .swatch-row .sw {
        width: 8px; height: 8px; border-radius: 1px;
        border: 1px solid color-mix(in oklch, var(--fg) 20%, transparent);
      }
      .swatch-row .sw.h { background: var(--b-human); }
      .swatch-row .sw.l { background: var(--b-light); }
      .swatch-row .sw.hv { background: var(--b-heavy); }
      .swatch-row .sw.a { background: var(--b-ai); }

      .theme-preview {
        display: inline-block;
        width: 14px; height: 14px;
        border-radius: 50%;
        border: 1px solid var(--line);
        margin-left: auto;
        margin-right: 4px;
        flex: 0 0 auto;
      }
      .theme-preview.light { background: #fafaf7; }
      .theme-preview.dark  { background: #0f0f11; }
      .theme-preview.system {
        background: linear-gradient(90deg, #fafaf7 0 50%, #0f0f11 50% 100%);
      }

      /* footer */
      .foot {
        margin-top: 28px;
        font-size: 10.5px; color: var(--muted);
        letter-spacing: 0.06em;
        display: flex; gap: 14px; flex-wrap: wrap;
        padding-top: 14px;
        border-top: 1px dashed var(--line-2);
      }
      .foot a {
        color: var(--muted); text-decoration: none;
        border-bottom: 1px dotted var(--muted);
      }
      .foot a:hover { color: var(--accent); border-color: var(--accent); }
      .migration-card {
        margin-bottom: 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        color: var(--fg-2);
        font-size: 12px;
      }
      .migration-card.error { border-color: var(--danger); }
      .migration-card strong { display: block; margin-bottom: 5px; color: var(--fg); }
      .migration-card .btn { margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="page-head">
      <div class="brand">
        <span class="mark"></span>
        SlopHammer
        <span class="sep">—</span>
        <span class="where">options</span>
      </div>
      <span class="ver" data-testid="page-version"></span>
    </div>

    <section id="migration" aria-live="polite"></section>
    <section id="install" class="install-slot"></section>

    <h2 class="settings-section-title">
      Settings <span class="count">/ 03</span>
    </h2>
    <div id="settings"></div>

    <div class="foot">
      <span>SlopHammer · browser extension</span>
      <a href="https://github.com/slomin/slophammer/issues/new" data-testid="foot-bug" target="_blank" rel="noreferrer">report a bug</a>
      <a href="https://github.com/slomin/slophammer/blob/main/docs/privacy.md" data-testid="foot-privacy" target="_blank" rel="noreferrer">what gets collected?</a>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
