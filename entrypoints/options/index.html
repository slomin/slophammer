<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Slop Hammer — Options</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --fg: #e5e5e5;
        --muted: #8a8a90;
        --panel: #151517;
        --border: #2a2a2d;
        --accent: #a5ffa5;
        --danger: #ff8080;
        --mono: ui-monospace, Menlo, monospace;
      }
      html[data-theme="light"] {
        --bg: #fafaf7;
        --fg: #17171a;
        --muted: #6d6a61;
        --panel: #ffffff;
        --border: #d8d5cc;
        --accent: #2a7a2a;
        --danger: #b8341a;
      }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--mono); }
      body { padding: 24px; max-width: 640px; }
      h1 { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
      h2 { font-size: 15px; margin: 0 0 6px; }
      p { margin: 4px 0; }
      code { background: var(--panel); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; }
      .muted { color: var(--muted); font-size: 13px; }
      .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
      section + section { margin-top: 28px; }
      .drop-zone {
        border: 1px dashed var(--border);
        border-radius: 6px;
        padding: 24px;
        text-align: center;
        cursor: pointer;
        background: var(--panel);
      }
      .drop-zone.dragover { border-color: var(--accent); }
      .btn {
        display: inline-block;
        margin-top: 10px;
        padding: 6px 14px;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      .btn:hover { filter: brightness(1.15); }
      .btn.danger { border-color: var(--danger); color: var(--danger); }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px;
      }
      .card.installed { display: flex; gap: 12px; align-items: center; }
      .card.installed .info { flex: 1; }
      .card.error { border-color: var(--danger); }
      .check { font-size: 20px; color: var(--accent); }
      .progress-bar {
        margin-top: 12px;
        height: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-bar > div { height: 100%; background: var(--accent); transition: width 120ms ease; }
      .settings-section-title {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .settings-group {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 16px;
        margin: 0 0 14px;
        background: var(--panel);
      }
      .settings-group legend {
        padding: 0 6px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--fg);
      }
      .settings-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 6px 0;
        cursor: pointer;
        font-size: 13px;
      }
      .settings-row input[type="radio"] { margin-top: 3px; accent-color: var(--accent); }
      .settings-row-text { display: flex; flex-direction: column; gap: 2px; }
      .settings-row-label { color: var(--fg); }
      .settings-row-desc { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Slop Hammer — Options</h1>
    <section id="install"></section>
    <section id="settings-section">
      <h2 class="settings-section-title">Settings</h2>
      <div id="settings"></div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
